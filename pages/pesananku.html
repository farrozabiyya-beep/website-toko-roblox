<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesananku - Toko Roblox</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header-section h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header-section p {
            color: #666;
            font-size: 14px;
        }

        .search-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 12px 24px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #666;
        }

        .tab-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .search-section.active {
            display: block;
        }

        .search-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .search-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Rajdhani', sans-serif;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .search-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .result-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            display: none;
            margin-top: 20px;
        }

        .result-section.active {
            display: block;
        }

        .result-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-details {
            flex: 1;
        }

        .profile-details p {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .profile-details strong {
            color: #333;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .order-item p {
            color: #666;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .order-item strong {
            color: #333;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .status-pending {
            background: #ffeaa7;
            color: #d63031;
        }

        .status-completed {
            background: #55efc4;
            color: #00b894;
        }

        .status-failed {
            background: #fab1a0;
            color: #d63031;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
            color: #ddd;
        }

        .error-message {
            background: #fab1a0;
            color: #d63031;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .success-message {
            background: #55efc4;
            color: #00b894;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .success-message.active {
            display: block;
        }

        @media (max-width: 600px) {
            .header-section {
                padding: 20px;
            }

            .search-section {
                padding: 20px;
            }

            .result-section {
                padding: 20px;
            }

            .profile-info {
                flex-direction: column;
                text-align: center;
            }

            .search-tabs {
                flex-direction: column;
            }

            .tab-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header-section">
            <h1>🔍 Cek Pesanan</h1>
            <p>Masukkan detail pesanan Anda untuk mencari status dan informasi pesanan</p>
        </div>

        <!-- Tab Buttons -->
        <div class="search-tabs">
            <button class="tab-btn active" onclick="switchTab('id')">
                <i class="fas fa-hashtag"></i> Cari ID Pesanan
            </button>
            <button class="tab-btn" onclick="switchTab('username')">
                <i class="fas fa-user"></i> Cari Username
            </button>
            <button class="tab-btn" onclick="switchTab('phone')">
                <i class="fas fa-phone"></i> Nomor Telepon
            </button>
        </div>

        <!-- Search Section 1: Cari ID Pesanan -->
        <div class="search-section active" id="id-section">
            <h2>Cari Berdasarkan ID Pesanan</h2>
            <div class="search-form">
                <div class="form-group">
                    <label for="id-input">Masukkan ID Pesanan</label>
                    <input type="text" id="id-input" placeholder="Contoh: ORD-2025-001234" />
                </div>
                <button class="search-btn" onclick="searchByID()">
                    <i class="fas fa-search"></i> Cari Pesanan
                </button>
                <div class="error-message" id="id-error"></div>
            </div>

            <!-- Result for ID Search -->
            <div class="result-section" id="id-result">
                <h3>📦 Hasil Pencarian</h3>
                <div id="id-result-content"></div>
            </div>
        </div>

        <!-- Search Section 2: Cari Username -->
        <div class="search-section" id="username-section">
            <h2>Cari Berdasarkan Username</h2>
            <div class="search-form">
                <div class="form-group">
                    <label for="username-input">Masukkan Username Roblox</label>
                    <input type="text" id="username-input" placeholder="Contoh: BuilderX123" />
                </div>
                <button class="search-btn" onclick="searchByUsername()">
                    <i class="fas fa-search"></i> Cari Pesanan
                </button>
                <div class="error-message" id="username-error"></div>
            </div>

            <!-- Result for Username Search -->
            <div class="result-section" id="username-result">
                <h3>👤 Profil & Pesanan</h3>
                <div id="username-result-content"></div>
            </div>
        </div>

        <!-- Search Section 3: Nomor Telepon -->
        <div class="search-section" id="phone-section">
            <h2>Cari Berdasarkan Nomor Telepon</h2>
            <div class="search-form">
                <div class="form-group">
                    <label for="phone-input">Masukkan Nomor Telepon</label>
                    <input type="tel" id="phone-input" placeholder="Contoh: 081234567890" />
                </div>
                <button class="search-btn" onclick="searchByPhone()">
                    <i class="fas fa-search"></i> Cari Pesanan
                </button>
                <div class="error-message" id="phone-error"></div>
            </div>

            <!-- Result for Phone Search -->
            <div class="result-section" id="phone-result">
                <h3>📱 Pesanan Terkait</h3>
                <div id="phone-result-content"></div>
            </div>
        </div>
    </div>

    <script>
        // Sample data from localStorage (atau dari admin panel)
        function getOrdersData() {
            const stored = localStorage.getItem('orders');
            return stored ? JSON.parse(stored) : [
                {
                    id: 'ORD-2025-001',
                    username: 'BuilderX123',
                    phone: '081234567890',
                    product: 'Robux 100k',
                    price: 150000,
                    status: 'completed',
                    date: '2025-11-15',
                    profileImage: 'https://www.roblox.com/headshot-thumbnail/image?userId=1&width=420&height=420&format=png'
                },
                {
                    id: 'ORD-2025-002',
                    username: 'PlayerPro456',
                    phone: '082345678901',
                    product: 'Gamepass Premium',
                    price: 75000,
                    status: 'pending',
                    date: '2025-11-18',
                    profileImage: null
                },
                {
                    id: 'ORD-2025-003',
                    username: 'GamerKing789',
                    phone: '083456789012',
                    product: 'Robux 50k',
                    price: 85000,
                    status: 'completed',
                    date: '2025-11-17',
                    profileImage: null
                }
            ];
        }

        function switchTab(tab) {
            // Hide all sections
            document.getElementById('id-section').classList.remove('active');
            document.getElementById('username-section').classList.remove('active');
            document.getElementById('phone-section').classList.remove('active');

            // Remove active class from all tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected section
            document.getElementById(tab + '-section').classList.add('active');

            // Add active class to clicked tab
            event.target.closest('.tab-btn').classList.add('active');

            // Clear previous results
            document.getElementById(tab + '-result').classList.remove('active');
            document.getElementById(tab + '-error').classList.remove('active');
        }

        function displayStatus(status) {
            const statusMap = {
                'pending': { text: '⏳ Menunggu Pembayaran', class: 'status-pending' },
                'completed': { text: '✅ Selesai', class: 'status-completed' },
                'failed': { text: '❌ Gagal', class: 'status-failed' }
            };
            return statusMap[status] || { text: 'Tidak Diketahui', class: '' };
        }

        function searchByID() {
            const id = document.getElementById('id-input').value.trim().toUpperCase();
            const errorDiv = document.getElementById('id-error');
            const resultDiv = document.getElementById('id-result');
            const contentDiv = document.getElementById('id-result-content');

            errorDiv.classList.remove('active');
            resultDiv.classList.remove('active');

            if (!id) {
                errorDiv.textContent = '⚠️ Silakan masukkan ID Pesanan';
                errorDiv.classList.add('active');
                return;
            }

            const orders = getOrdersData();
            const order = orders.find(o => o.id === id);

            if (order) {
                const status = displayStatus(order.status);
                contentDiv.innerHTML = `
                    <div class="order-item">
                        <p><strong>ID Pesanan:</strong> ${order.id}</p>
                        <p><strong>Username:</strong> ${order.username}</p>
                        <p><strong>Produk:</strong> ${order.product}</p>
                        <p><strong>Harga:</strong> Rp ${order.price.toLocaleString('id-ID')}</p>
                        <p><strong>Tanggal:</strong> ${new Date(order.date).toLocaleDateString('id-ID')}</p>
                        <span class="status-badge ${status.class}">${status.text}</span>
                    </div>
                `;
                resultDiv.classList.add('active');
            } else {
                errorDiv.textContent = '❌ Pesanan tidak ditemukan. Periksa kembali ID Pesanan Anda.';
                errorDiv.classList.add('active');
            }
        }

        function searchByUsername() {
            const username = document.getElementById('username-input').value.trim();
            const errorDiv = document.getElementById('username-error');
            const resultDiv = document.getElementById('username-result');
            const contentDiv = document.getElementById('username-result-content');

            errorDiv.classList.remove('active');
            resultDiv.classList.remove('active');

            if (!username) {
                errorDiv.textContent = '⚠️ Silakan masukkan Username Roblox';
                errorDiv.classList.add('active');
                return;
            }

            const orders = getOrdersData();
            const userOrders = orders.filter(o => o.username.toLowerCase() === username.toLowerCase());

            if (userOrders.length > 0) {
                const order = userOrders[0];
                const status = displayStatus(order.status);
                
                // Try to fetch Roblox profile image
                const profileImage = order.profileImage || `https://www.roblox.com/headshot-thumbnail/image?username=${username}&width=420&height=420&format=png`;

                contentDiv.innerHTML = `
                    <div class="profile-info">
                        <div class="profile-avatar">
                            <img src="${profileImage}" alt="${username}" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\"fas fa-user\"></i>'">
                        </div>
                        <div class="profile-details">
                            <p><strong>Username:</strong> ${username}</p>
                            <p><strong>Jumlah Pesanan:</strong> ${userOrders.length}</p>
                            <p><strong>Pesanan Terakhir:</strong> ${userOrders[0].date}</p>
                        </div>
                    </div>
                    <div class="order-list">
                        ${userOrders.map(o => {
                            const s = displayStatus(o.status);
                            return `
                                <div class="order-item">
                                    <p><strong>ID Pesanan:</strong> ${o.id}</p>
                                    <p><strong>Produk:</strong> ${o.product}</p>
                                    <p><strong>Harga:</strong> Rp ${o.price.toLocaleString('id-ID')}</p>
                                    <p><strong>Tanggal:</strong> ${new Date(o.date).toLocaleDateString('id-ID')}</p>
                                    <span class="status-badge ${s.class}">${s.text}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                resultDiv.classList.add('active');
            } else {
                errorDiv.textContent = '❌ Tidak ada pesanan untuk username ini.';
                errorDiv.classList.add('active');
            }
        }

        function searchByPhone() {
            const phone = document.getElementById('phone-input').value.trim();
            const errorDiv = document.getElementById('phone-error');
            const resultDiv = document.getElementById('phone-result');
            const contentDiv = document.getElementById('phone-result-content');

            errorDiv.classList.remove('active');
            resultDiv.classList.remove('active');

            if (!phone) {
                errorDiv.textContent = '⚠️ Silakan masukkan Nomor Telepon';
                errorDiv.classList.add('active');
                return;
            }

            const orders = getOrdersData();
            const phoneOrders = orders.filter(o => o.phone === phone);

            if (phoneOrders.length > 0) {
                contentDiv.innerHTML = `
                    <div class="order-list">
                        ${phoneOrders.map(o => {
                            const status = displayStatus(o.status);
                            return `
                                <div class="order-item">
                                    <p><strong>ID Pesanan:</strong> ${o.id}</p>
                                    <p><strong>Username:</strong> ${o.username}</p>
                                    <p><strong>Produk:</strong> ${o.product}</p>
                                    <p><strong>Harga:</strong> Rp ${o.price.toLocaleString('id-ID')}</p>
                                    <p><strong>Tanggal:</strong> ${new Date(o.date).toLocaleDateString('id-ID')}</p>
                                    <span class="status-badge ${status.class}">${status.text}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                resultDiv.classList.add('active');
            } else {
                errorDiv.textContent = '❌ Tidak ada pesanan untuk nomor telepon ini.';
                errorDiv.classList.add('active');
            }
        }

        // Allow Enter key to search
        document.getElementById('id-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchByID();
        });
        document.getElementById('username-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchByUsername();
        });
        document.getElementById('phone-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchByPhone();
        });
    </script>
</body>
</html>
