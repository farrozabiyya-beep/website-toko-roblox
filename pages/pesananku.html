<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesananku - Toko Roblox</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 14px;
        }

        .orders-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .order-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .order-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-id {
            font-weight: bold;
            font-size: 14px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge.pending {
            background: #ffc107;
            color: #333;
        }

        .status-badge.completed {
            background: #28a745;
            color: white;
        }

        .status-badge.failed {
            background: #dc3545;
            color: white;
        }

        .status-badge.processing {
            background: #17a2b8;
            color: white;
        }

        .order-body {
            padding: 15px;
        }

        .order-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .order-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .item-label {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .item-value {
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }

        .product-name {
            color: #667eea;
            font-weight: bold;
        }

        .order-footer {
            padding: 15px;
            background: #f8f9fa;
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 8px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 30px;
        }

        .btn-create {
            display: inline-block;
            padding: 10px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
        }

        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: white;
            color: #667eea;
        }

        .filter-btn:hover {
            background: white;
            color: #667eea;
        }

        .search-box {
            margin-bottom: 30px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-footer button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-footer .btn-cancel {
            background: #e9ecef;
            color: #333;
        }

        .modal-footer .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .orders-wrapper {
                grid-template-columns: 1fr;
            }

            .filter-section {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }

            .modal-content {
                padding: 20px;
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .order-detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 500px) {
            .order-detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Pesananku</h1>
            <p>Kelola dan lacak semua pesanan Anda</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari pesanan berdasarkan ID, nama, atau email...">
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-status="all">Semua (0)</button>
            <button class="filter-btn" data-status="pending">Pending (0)</button>
            <button class="filter-btn" data-status="processing">Processing (0)</button>
            <button class="filter-btn" data-status="completed">Completed (0)</button>
            <button class="filter-btn" data-status="failed">Failed (0)</button>
        </div>

        <div class="success-message" id="successMessage">
            ✓ Pesanan berhasil diperbarui!
        </div>

        <div class="orders-wrapper" id="ordersContainer">
            <!-- Orders akan di-render di sini -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">📭</div>
            <h2>Tidak Ada Pesanan</h2>
            <p>Anda belum memiliki pesanan. Mulai berbelanja sekarang!</p>
            <a href="../pages/product.html" class="btn-create">Mulai Belanja</a>
        </div>
    </div>

    <!-- Modal Detail Pesanan -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Detail Pesanan</h2>
                <button class="close-btn" onclick="closeOrderModal()">×</button>
            </div>
            <div class="modal-body" id="orderModalBody"></div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeOrderModal()">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Modal Edit Pesanan -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Pesanan</h2>
                <button class="close-btn" onclick="closeEditModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <div class="form-group">
                        <label>Nama</label>
                        <input type="text" id="editName" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="editEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Nomor Telepon</label>
                        <input type="tel" id="editPhone" required>
                    </div>
                    <div class="form-group">
                        <label>Catatan (Opsional)</label>
                        <textarea id="editNotes"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeEditModal()">Batal</button>
                <button class="btn-save" onclick="saveEditOrder()">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/order-system.js"></script>
    <script>
        let currentFilter = 'all';
        let currentEditingOrderId = null;
        let filteredOrders = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderOrders();
            setupEventListeners();
            setupSubscription();
            updateFilterCounts();
        });

        /**
         * Setup event listeners
         */
        function setupEventListeners() {
            // Search input
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const query = e.target.value;
                if (query.trim()) {
                    filteredOrders = orderSystem.searchOrders(query);
                } else {
                    applyFilter(currentFilter);
                }
                renderOrders();
            });

            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.status;
                    applyFilter(currentFilter);
                    renderOrders();
                });
            });
        }

        /**
         * Setup subscription to order changes
         */
        function setupSubscription() {
            orderSystem.subscribe(() => {
                updateFilterCounts();
                applyFilter(currentFilter);
                renderOrders();
            });
        }

        /**
         * Apply filter
         */
        function applyFilter(status) {
            if (status === 'all') {
                filteredOrders = orderSystem.getAllOrders();
            } else {
                filteredOrders = orderSystem.getOrdersByStatus(status);
            }
        }

        /**
         * Update filter counts
         */
        function updateFilterCounts() {
            const counts = {
                all: orderSystem.getAllOrders().length,
                pending: orderSystem.getOrdersByStatus('pending').length,
                processing: orderSystem.getOrdersByStatus('processing').length,
                completed: orderSystem.getOrdersByStatus('completed').length,
                failed: orderSystem.getOrdersByStatus('failed').length
            };

            document.querySelectorAll('.filter-btn').forEach(btn => {
                const status = btn.dataset.status;
                btn.textContent = btn.textContent.split('(')[0].trim() + ` (${counts[status]})`;
            });
        }

        /**
         * Render orders
         */
        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const emptyState = document.getElementById('emptyState');

            if (filteredOrders.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = filteredOrders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-id">${order.id}</span>
                        <span class="status-badge ${order.status}">${order.status.toUpperCase()}</span>
                    </div>
                    <div class="order-body">
                        <div class="order-item">
                            <div class="item-label">Username</div>
                            <div class="item-value">${order.username || '-'}</div>
                        </div>
                        <div class="order-item">
                            <div class="item-label">Produk</div>
                            <div class="item-value product-name">${order.productName || '-'}</div>
                        </div>
                        <div class="order-item">
                            <div class="item-label">Harga</div>
                            <div class="item-value">Rp ${(order.total || 0).toLocaleString('id-ID')}</div>
                        </div>
                        <div class="order-item">
                            <div class="item-label">Tanggal</div>
                            <div class="item-value">${new Date(order.createdAt).toLocaleDateString('id-ID')}</div>
                        </div>
                    </div>
                    <div class="order-footer">
                        <button class="btn btn-primary" onclick="viewOrderDetail('${order.id}')">
                            👁️ Lihat Detail
                        </button>
                        <button class="btn btn-secondary" onclick="editOrder('${order.id}')">
                            ✏️ Edit
                        </button>
                        <button class="btn btn-danger" onclick="deleteOrder('${order.id}')">
                            🗑️ Hapus
                        </button>
                    </div>
                </div>
            `).join('');
        }

        /**
         * View order detail
         */
        function viewOrderDetail(orderId) {
            const order = orderSystem.findOrder(orderId);
            if (!order) return;

            const modalBody = document.getElementById('orderModalBody');
            modalBody.innerHTML = `
                <div class="order-detail-grid">
                    <div>
                        <div class="item-label">Order ID</div>
                        <div class="item-value">${order.id}</div>
                    </div>
                    <div>
                        <div class="item-label">Status</div>
                        <div class="item-value"><span class="status-badge ${order.status}">${order.status}</span></div>
                    </div>
                    <div>
                        <div class="item-label">Username</div>
                        <div class="item-value">${order.username || '-'}</div>
                    </div>
                    <div>
                        <div class="item-label">Email</div>
                        <div class="item-value">${order.email || '-'}</div>
                    </div>
                    <div>
                        <div class="item-label">Nomor Telepon</div>
                        <div class="item-value">${order.phone || '-'}</div>
                    </div>
                    <div>
                        <div class="item-label">Produk</div>
                        <div class="item-value">${order.productName || '-'}</div>
                    </div>
                    <div>
                        <div class="item-label">Harga</div>
                        <div class="item-value">Rp ${(order.total || 0).toLocaleString('id-ID')}</div>
                    </div>
                    <div>
                        <div class="item-label">Metode Pembayaran</div>
                        <div class="item-value">${order.paymentMethod || '-'}</div>
                    </div>
                    <div>
                        <div class="item-label">Tanggal Dibuat</div>
                        <div class="item-value">${new Date(order.createdAt).toLocaleString('id-ID')}</div>
                    </div>
                    <div>
                        <div class="item-label">Terakhir Diperbarui</div>
                        <div class="item-value">${new Date(order.updatedAt).toLocaleString('id-ID')}</div>
                    </div>
                </div>
                ${order.notes ? `
                    <div style="margin-top: 15px;">
                        <div class="item-label">Catatan</div>
                        <div class="item-value" style="white-space: pre-wrap;">${order.notes}</div>
                    </div>
                ` : ''}
            `;
            document.getElementById('orderModal').classList.add('active');
        }

        /**
         * Close order modal
         */
        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        /**
         * Edit order
         */
        function editOrder(orderId) {
            const order = orderSystem.findOrder(orderId);
            if (!order) return;

            currentEditingOrderId = orderId;
            document.getElementById('editName').value = order.username || '';
            document.getElementById('editEmail').value = order.email || '';
            document.getElementById('editPhone').value = order.phone || '';
            document.getElementById('editNotes').value = order.notes || '';

            document.getElementById('editModal').classList.add('active');
        }

        /**
         * Save edited order
         */
        function saveEditOrder() {
            if (!currentEditingOrderId) return;

            const updates = {
                username: document.getElementById('editName').value,
                email: document.getElementById('editEmail').value,
                phone: document.getElementById('editPhone').value,
                notes: document.getElementById('editNotes').value
            };

            orderSystem.updateOrder(currentEditingOrderId, updates);
            closeEditModal();
            showSuccessMessage();
        }

        /**
         * Close edit modal
         */
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditingOrderId = null;
        }

        /**
         * Delete order
         */
        function deleteOrder(orderId) {
            if (confirm('Apakah Anda yakin ingin menghapus pesanan ini?')) {
                orderSystem.deleteOrder(orderId);
                showSuccessMessage('Pesanan berhasil dihapus!');
            }
        }

        /**
         * Show success message
         */
        function showSuccessMessage(message = 'Pesanan berhasil diperbarui!') {
            const msg = document.getElementById('successMessage');
            msg.textContent = '✓ ' + message;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
